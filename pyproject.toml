[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clip-bridge"
version = "0.1.0"
description = "Local bridge: pipe clipped browser pages (screenshots + metadata) into Claude Code over MCP."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.28",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
clip-bridge = "server:main"

[tool.setuptools]
py-modules = ["server"]
